<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="лорп длорп">
  <meta name="theme-color" content="#080c10">
  <title>лорп длорп</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #080c10;
      background-image: radial-gradient(circle at top, #14232b 0%, #080c10 70%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 24rem;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      background: rgba(13, 19, 26, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.55);
      overflow: hidden;
    }
    .profile { text-align: center; }
    .avatar {
      width: 6rem; height: 6rem;
      border-radius: 9999px;
      object-fit: cover;
      object-position: center center;
      border: 2px solid #22b4ad;
      box-shadow: 0 0 20px rgba(34,180,173,.35);
      margin-bottom: .5rem;
    }
    .name { font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
    .company { font-size: .75rem; font-weight: 600; color: #22b4ad; margin-top: .25rem; }
    .title { font-size: .75rem; color: rgba(255,255,255,.7); margin-top: .125rem; }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      width: 100%; margin-top: .75rem;
      padding: .625rem 1rem;
      border-radius: .75rem;
      background: linear-gradient(90deg, #22b4ad, #1fb3a8);
      color: #080c10;
      font-size: .875rem; font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(34,180,173,.25);
    }
    .btn-primary:active { transform: scale(.98); }
    .icon-btn { width: 1rem; height: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
      margin: .5rem 0;
    }
    .tile {
      display: flex; align-items: center; gap: .5rem;
      padding: .5rem;
      border-radius: .75rem;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .tile:active { transform: scale(.98); }
    .tile-icon {
      flex-shrink: 0;
      width: 1.75rem; height: 1.75rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: .5rem;
    }
    .icon { width: .875rem; height: .875rem; display: block; }
    .tile-text { min-width: 0; }
    .tile-label { display: block; font-size: 9px; color: rgba(255,255,255,.55); }
    .tile-value { display: block; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .site-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem .75rem;
      border-radius: .75rem;
      border: 1px solid rgba(34,180,173,.3);
      background: rgba(255,255,255,.05);
      text-decoration: none;
      color: #22b4ad;
      font-size: 11px; font-weight: 500;
    }
    .site-banner:active { transform: scale(.98); }
    .pulse-dot {
      width: 6px; height: 6px; border-radius: 9999px;
      background: #22b4ad;
      box-shadow: 0 0 8px rgba(34,180,173,.8);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .footer { text-align: center; font-size: 10px; color: rgba(255,255,255,.4); padding-top: .25rem; }
    .chevron { width: .875rem; height: .875rem; opacity: .6; flex-shrink: 0; }
  </style>
</head>
<body>
  <main class="card">
    <div>
      <section class="profile">
        <img src="avatar.jpg" alt="лорп длорп" class="avatar" width="96" height="96" decoding="async">
        <h1 class="name">лорп длорп</h1>
      </section>
      <a href="contact.vcf" class="btn-primary" download="Lorp_Dlorp.vcf">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-btn" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2.2"/><line x1="19" y1="8" x2="19" y2="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line x1="22" y1="11" x2="16" y2="11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Добавить в контакты
      </a>
    </div>


    <div>
      <p class="footer">© 2026</p>
    </div>
  </main>
  <script>
    (function () {
      var btn = document.querySelector(".btn-primary");
      if (!btn) return;
      btn.setAttribute("href", "contact.vcf");
      btn.setAttribute("download", "Lorp_Dlorp.vcf");
    })();
  </script>
</body>
</html>
